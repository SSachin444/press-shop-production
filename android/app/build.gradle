def readEnvConfig() {
    def props = new Properties()
    def workspaceRoot = rootProject.projectDir.parentFile
    [new File(workspaceRoot, ".env"), new File(workspaceRoot, "web_app/.env")].each { envFile ->
        if (envFile.exists()) {
            envFile.eachLine("UTF-8") { raw ->
                def line = raw.trim()
                if (!line.isEmpty() && !line.startsWith("#") && line.contains("=")) {
                    def idx = line.indexOf("=")
                    def k = line.substring(0, idx).trim()
                    def v = line.substring(idx + 1).trim().replaceAll('^["\']|["\']$', '')
                    props.setProperty(k, v)
                }
            }
        }
    }
    return props
}

def readKeystoreProperties() {
    def kp = new Properties()
    def ksFile = rootProject.file("keystore.properties")
    if (ksFile.exists()) {
        ksFile.withInputStream { kp.load(it) }
    }
    return kp
}

